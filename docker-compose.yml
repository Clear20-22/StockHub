version: '3.8'

services:
  # --- Backend FastAPI Application ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockhub-backend
    restart: unless-stopped
    # Browsers reach the API through the frontend's nginx /api proxy;
    # this port is only published on the host's loopback interface for debugging
    ports:
      - "127.0.0.1:8000:8000"
    # Secrets come from the project-root .env file (see .env.example); startup fails if they're missing
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite:////app/stockhub.db
      - MONGODB_URL=mongodb://${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongodb:27017/?authSource=admin
      - MONGODB_DB_NAME=stockhub
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY:?Set REFRESH_SECRET_KEY in .env}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - CORS_ORIGINS=["http://localhost"]
    volumes:
      - backend-data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # --- Frontend React Single Page Application (Nginx) ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Empty = same origin, through the nginx /api proxy
        - VITE_API_BASE_URL=
    container_name: stockhub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # --- MongoDB Database Service ---
  mongodb:
    image: mongo:6.0
    container_name: stockhub-mongodb
    restart: unless-stopped
    # Not published to the host: only the backend on the internal network can reach it
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  backend-data:
    driver: local
  mongodb-data:
    driver: local

networks:
  default:
    name: stockhub-network
