version: '3.8'

services:
  # --- Backend FastAPI Application ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockhub-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite:////app/stockhub.db
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=stockhub
      - SECRET_KEY=production-super-secret-key-change-in-env-file
      - REFRESH_SECRET_KEY=production-super-secret-refresh-key-change-in-env-file
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    volumes:
      - backend-data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # --- Frontend React Single Page Application (Nginx) ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockhub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # --- MongoDB Database Service ---
  mongodb:
    image: mongo:6.0
    container_name: stockhub-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  backend-data:
    driver: local
  mongodb-data:
    driver: local

networks:
  default:
    name: stockhub-network
